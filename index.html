                                                        onChange={(e) => setHeroConfig({...heroConfig, titleFa: e.target.value})}
                                                        className="w-full p-2.5 rounded-lg bg-dark-card border border-cyber-border text-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-gray-400 block mb-1">{isRtl ? 'زیرعنوان هیرو (فارسی):' : 'Hero Subtitle (FA):'}</label>
                                                    <textarea 
                                                        rows="2"
                                                        value={heroConfig.subFa}
                                                        onChange={(e) => setHeroConfig({...heroConfig, subFa: e.target.value})}
                                                        className="w-full p-2.5 rounded-lg bg-dark-card border border-cyber-border text-white"
                                                    />
                                                </div>
                                                <p className="text-cyber-emerald text-[11px]">✔️ تغییرات بلافاصله روی وب‌سایت اعمال می‌شوند.</p>
                                            </div>
                                        )}

                                        {/* Tab Content: Posts */}
                                        {adminTab === 'posts' && (
                                            <div className="space-y-3 text-xs">
                                                <button 
                                                    onClick={() => {
                                                        const newP = {
                                                            id: Date.now(),
                                                            title: "پست جدید مدیریت کانال",
                                                            titleEn: "New Channel Update Post",
                                                            category: "اخبار",
                                                            categoryEn: "News",
                                                            date: "هم‌اکنون",
                                                            desc: "توضیحات پست افزوده‌شده از پنل مدیریت اختصاصی.",
                                                            descEn: "Description added dynamically from admin CMS.",
                                                            telegramUrl: "https://t.me/turbovpn10",
                                                            views: "1"
                                                        };
                                                        setPosts([newP, ...posts]);
                                                    }}
                                                    className="px-4 py-2 rounded-lg bg-cyber-emerald text-dark-base font-bold mb-2"
                                                >
                                                    + {isRtl ? 'افزودن پست نمونه جدید' : 'Add Quick Demo Post'}
                                                </button>
                                                {posts.map(p => (
                                                    <div key={p.id} className="flex justify-between items-center bg-dark-card p-3 rounded-lg border border-cyber-border">
                                                        <span>{isRtl ? p.title : p.titleEn}</span>
                                                        <button 
                                                            onClick={() => setPosts(posts.filter(x => x.id !== p.id))}
                                                            className="text-rose-400 font-bold"
                                                        >
                                                            {isRtl ? 'حذف' : 'Delete'}
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                    </div>
                                )}

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
